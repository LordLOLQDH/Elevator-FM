<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f5f2">
<meta name="description" content="ELEVATOR FM — uninterrupted elevator music, lounge, easy listening and ambient instrumentals.">
<title>ELEVATOR FM</title>
<style>
:root{color-scheme:light;--bg:#f4f5f2;--panel:#fff;--ink:#222b2b;--muted:#727d7c;--line:#e3e8e5;--accent:#688c88;--accent-dark:#3f6c67}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,720px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brandmark{font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--muted)}.live{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;color:var(--accent-dark);font-weight:700}.dot{width:7px;height:7px;background:#5f9c8c;border-radius:50%;box-shadow:0 0 0 4px #5f9c8c1c}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,6vw,52px);box-shadow:0 16px 50px #243c3510}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.name{font-size:clamp(40px,9vw,76px);font-weight:650;letter-spacing:-.065em;line-height:.98;margin:18px 0 12px}.tagline{font-size:14px;color:var(--muted);line-height:1.6;margin:0}.divider{height:1px;background:var(--line);margin:32px 0}
.player{display:flex;align-items:center;gap:18px}.play{border:0;border-radius:50%;width:64px;height:64px;flex:0 0 64px;background:var(--accent-dark);color:white;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .15s}.play:hover{background:#315b56;transform:scale(1.04)}.play:focus-visible{outline:3px solid #a8c5bf;outline-offset:4px}.play svg{width:24px;height:24px}.tracklabel{font-size:13px;font-weight:600}.status{font-size:12px;color:var(--muted);margin-top:6px}.volume{margin-top:24px;display:flex;align-items:center;gap:12px;color:var(--muted)}.volume svg{width:18px;height:18px}.volume input{width:100%;accent-color:var(--accent-dark)}
.footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:24px 4px;color:var(--muted);font-size:11px;letter-spacing:.04em}.footer a{color:var(--muted);text-decoration:none}.footer a:hover{color:var(--accent-dark)}
@media(max-width:480px){body{padding:16px}.top{margin-bottom:24px}.card{border-radius:18px}.name{font-size:48px}.footer{justify-content:center;text-align:center}}
</style>
</head>
<body>
<main>
<header class="top"><div class="brandmark">INDEPENDENT RADIO</div><div class="live"><span class="dot"></span> ON AIR</div></header>
<section class="card">
<div class="eyebrow">Continuous background music</div>
<h1 class="name">ELEVATOR FM</h1>
<p class="tagline">Easy listening. Soft instrumentals. Lounge and ambient sounds.<br>No talk. Just music.</p>
<div class="divider"></div>
<div class="player">
<button class="play" id="play" aria-label="Play radio" title="Play radio"><svg id="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg></button>
<div><div class="tracklabel">ELEVATOR FM · Live stream</div><div class="status" id="status">Ready to listen</div></div>
</div>
<div class="volume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><input id="volume" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="Volume"></div>
<audio id="audio" preload="none" src="https://beyoudwaves.com/streams/d0af65b8-b5ef-4398-a658-e971d5866f94"></audio>
</section>
<footer class="footer"><span>24 / 7 · MUSIC WITHOUT INTERRUPTION</span><a href="https://beyoudwaves.com/streams/d0af65b8-b5ef-4398-a658-e971d5866f94" target="_blank" rel="noopener">STREAM SOURCE ↗</a></footer>
</main>
<script>
const audio=document.getElementById('audio'),button=document.getElementById('play'),icon=document.getElementById('icon'),status=document.getElementById('status'),volume=document.getElementById('volume');
const playPath='<path d="M8 5.5v13l10-6.5z"/>',pausePath='<path d="M7 5h4v14H7zM14 5h4v14h-4z"/>';
audio.volume=Number(volume.value);
volume.addEventListener('input',()=>audio.volume=Number(volume.value));
button.addEventListener('click',async()=>{if(audio.paused){status.textContent='Connecting…';try{await audio.play();status.textContent='Playing live';icon.innerHTML=pausePath;button.setAttribute('aria-label','Pause radio')}catch(e){status.textContent='Stream did not connect. Open the stream source below to listen.';}}else{audio.pause();status.textContent='Paused';icon.innerHTML=playPath;button.setAttribute('aria-label','Play radio')}});
audio.addEventListener('playing',()=>{status.textContent='Playing live';icon.innerHTML=pausePath;button.setAttribute('aria-label','Pause radio')});
audio.addEventListener('pause',()=>{if(!audio.ended){icon.innerHTML=playPath;button.setAttribute('aria-label','Play radio')}});
audio.addEventListener('error',()=>{status.textContent='Player connection failed. Try the stream source link.'});
</script>
</body>
</html>
